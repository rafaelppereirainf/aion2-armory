  ['Combat Speed','12,98%','11,2–13%'], ['Damage Boost','7,30%','6,29–7,30%'],
  ['Weapon Damage Boost','9,64%','8,32–9,64%'], ['Might','32','22–32'],
  ['Multi-hit Chance','9,64%','8,32–9,64%']
];
const gear = {
  arma: ['Dagger', mainStats, substats, [['Attack','51','38–51']]],
  capacete: ['Helm', [['HP','255'],['Defense','567']], [
    ['Double Chance','2,20%','1,85–2,2%'],['Attack Increase','2,20%','1,85–2,2%'],['Attack','29','19–29'],['Rear Smite','Lv. 1'],['Exploit Weakness','Lv. 1']]],
  ombreiras: ['Pauldrons', [['HP','255'],['Defense','567']], [
    ['Critical Damage Boost','12,84%','11,1–12,8%'],['Double Chance','1,77%','1,48–1,77%'],['Attack','24','15–24'],['Rear Smite','Lv. 1'],['Exploit Weakness','Lv. 1']]],
  peitoral: ['Breastplate', [['HP','408'],['Defense','756']], [
    ['Damage Boost','6,58%','5,66–6,58%'],['Attack','33','23–33'],['Perfect Chance','5,81%','4,99–5,81%'],['Rear Smite','Lv. 1'],['Exploit Weakness','Lv. 1']]],
  calcas: ['Greaves', [['HP','306'],['Defense','630']], [
    ['Attack Increase','2,40%','2,03–2,4%'],['Attack','31','21–31'],['Perfect Chance','5,33%','4,57–5,33%'],['Damage Tolerance','11,56%','9,99–11,6%'],['Rear Smite','Lv. 1']]],
  luvas: ['Gloves', [['HP','204'],['Defense','504']], [
    ['Combat Speed','7,25%','6,24–7,25%'],['Attack','22','13–22'],['Perfect Chance','3,42%','2,91–3,42%'],['Rear Smite','Lv. 1'],['Assault Stance','Lv. 1']]],
  capa: ['Cloak', [['HP','204'],['Defense','504']], [
    ['Double Chance','1,77%','1,48–1,77%'],['Attack Increase','1,77%','1,48–1,77%'],['Attack','24','15–24'],['Rear Smite','Lv. 1'],['Weapon Damage Tolerance','9,64%','8,32–9,64%']]],
  botas: ['Boots', [['HP','204'],['Defense','504']], [
    ['Attack','27','17–27'],['Perfect Chance','4,37%','3,74–4,37%'],['Move Speed','10,28%','8,88–10,3%'],['Rear Smite','Lv. 1'],['Exploit Weakness','Lv. 1']]],
  brincos: ['Earrings', [['Defense','315'],['Attack','131']], [
    ['Might','16','8–16'],['Attack','33','23–33'],['Move Speed','6,45%','5,55–6,45%'],['Precision','16','8–16'],['Rear Smite','Lv. 1']]],
  colar: ['Necklace', [['Defense','378'],['Attack','158']], [
    ['Combat Speed','4,37%','3,74–4,37%'],['Might','20','11–20'],['Attack','38','27–38'],['Rear Smite','Lv. 1'],['Assault Stance','Lv. 1']]],
  aneis: ['Ring', [['Defense','252'],['Attack','105']], [
    ['Might','14','6–14'],['Attack','29','19–29'],['Precision','14','6–14'],['Insignia Explosion','Lv. 1'],['Heart Gore','Lv. 1']]],

    ['Wisdom [Lumiel]','15','7–15'],['Illusion [Kaisinel]','15','7–15'],['Destruction [Zikel]','15','7–15'],['Freedom [Vaizel]','15','7–15']]]
};
function statTable(headers, rows) {
  return '<table><thead><tr>' + headers.map(label => '<th scope="col">' + label + '</th>').join('') +
    '</tr></thead><tbody>' + rows.map(row => '<tr>' + row.map(value => '<td>' + value + '</td>').join('') +
    '</tr>').join('') + '</tbody></table>';
}
const grid = document.querySelector('.grid');
const storageKey = 'aion2-armory-stats-v1';
let edits = {};
try {
  edits = JSON.parse(localStorage.getItem(storageKey) || '{}') || {};
} catch {}

const suggestions = new Set(['Critical Attack', 'Back Attack', 'Front Attack']);
for (const [, ...groups] of Object.values(gear)) {
  for (const rows of groups) {
    for (const [name] of rows) suggestions.add(name);
  }
}
const options = document.querySelector('#stat-options');
for (const name of [...suggestions].sort()) {
  const option = document.createElement('option');
  option.value = name;
  options.append(option);
}

const sections = [
  ['Stats base', ['Stat', 'Valor']],
  ['Substats aleatórios', ['Stat', 'Valor', 'Intervalo']],
  ['Philosopher’s Stone', ['Stat', 'Valor', 'Intervalo']]
];

function textElement(tag, value, className) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  return element;
}

function renderCard(article, id, label, editing = false, message = '') {
  const [name, ...defaults] = gear[id];
  const groups = edits[id] ?? defaults;
  const title = id === 'bracelete' ? name : 'Splendent Ebony Dragon Lord ' + name;
  const heading = document.createElement('div');
  heading.className = 'item-heading';
  const icon = document.createElement('img');
  icon.src = itemIcons[id];
  icon.alt = '';
  heading.append(icon, textElement('h2', title));
  article.replaceChildren(textElement('p', label, 'eyebrow'), heading);

  const form = document.createElement('form');
  const fields = [];
  for (const groupIndex of [1, 0, 2]) {
    const rows = groups[groupIndex];
    if (!rows) continue;
    const [sectionTitle, columns] = sections[groupIndex];
    form.append(textElement('h3', sectionTitle));
    if (!editing) {
      const container = document.createElement('div');
      container.innerHTML = statTable(columns, rows.map(row => columns.map((_, index) =>
        (row[index] || '—').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;'))));
      form.append(container);
      continue;
    }
    const labels = document.createElement('div');
    labels.className = 'edit-row edit-labels' + (columns.length === 2 ? ' base' : '');
    labels.setAttribute('aria-hidden', 'true');
    for (const column of columns) labels.append(textElement('span', column));
    form.append(labels);
    fields[groupIndex] = rows.map((row, rowIndex) => {
      const line = document.createElement('div');
      line.className = 'edit-row' + (columns.length === 2 ? ' base' : '');
      const inputs = columns.map((column, index) => {
        const input = document.createElement('input');
        input.value = row[index] ?? '';
        input.setAttribute('aria-label', sectionTitle + ', linha ' + (rowIndex + 1) + ', ' + column);
        input.required = index < 2;
        if (index === 0) input.setAttribute('list', 'stat-options');
        line.append(input);
        return input;
      });
      form.append(line);
      return inputs;
    });
  }
  if (id === 'arma') form.append(textElement('small', 'Última linha dos stats base do guia por confirmar.'));

  const actions = document.createElement('div');
  actions.className = 'actions';
  const primary = textElement('button', editing ? 'Guardar' : 'Editar stats');
  primary.type = editing ? 'submit' : 'button';
  actions.append(primary);
  if (editing) {
    const cancel = textElement('button', 'Cancelar');
    cancel.type = 'button';
    cancel.onclick = () => renderCard(article, id, label).focus();
    actions.append(cancel);
    form.onsubmit = event => {
      event.preventDefault();
      const next = {...edits, [id]: fields.map(rows => rows.map(inputs => inputs.map(input => input.value.trim())))};
      try {
        localStorage.setItem(storageKey, JSON.stringify(next));
        edits = next;
        renderCard(article, id, label, false, 'Alterações guardadas neste navegador.').focus();
      } catch {
        feedback.textContent = 'Não foi possível guardar as alterações neste navegador.';
      }
    };
  } else {
    primary.onclick = () => {
      renderCard(article, id, label, true);
      article.querySelector('input')?.focus();
    };
    if (edits[id]) {
      const reset = textElement('button', 'Repor valores do guia');
      reset.type = 'button';
      reset.onclick = () => {
        const next = {...edits};
        delete next[id];
        try {
          localStorage.setItem(storageKey, JSON.stringify(next));
          edits = next;
          renderCard(article, id, label, false, 'Valores do guia repostos.').focus();
        } catch {
          feedback.textContent = 'Não foi possível guardar a reposição.';
        }
      };
      actions.append(reset);
    }
  }
  const feedback = textElement('p', message, 'feedback');
  feedback.setAttribute('role', 'status');
  form.append(actions, feedback);
  article.append(form);
  return primary;
}

for (const [id, label] of slots) {
  const article = document.createElement('article');
  article.id = id;
  renderCard(article, id, label);
  grid.append(article);
}
</script>
